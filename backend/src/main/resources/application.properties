# ---- Server ----
server.port=${PORT:8080}

# ---- Database (Neon / local Postgres) ----
# Neon example: jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

# ---- Security (NO defaults on purpose: app refuses to start without JWT_SECRET) ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=168
app.admin-emails=${ADMIN_EMAILS:}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- OAuth (client id + secret from Google Cloud / GitHub developer settings) ----
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# ---- Email delivery for password reset codes ----
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@internshield.app}
